paths:
  /api/battle/rooms:
    post:
      tags: [Battle]
      summary: 배틀룸 생성
      description: 게스트 토큰으로 배틀룸을 생성합니다.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/BattleRoomCreateResponse'
              example:
                sessionId: b_w1kGLU_M
                roomCode: METZXD
                state: waiting
                hostId: plr_host123
                inviteLink: https://hyunseoko.store/join/METZXD
        '400':
          $ref: '../components/responses.yaml#/BadRequest'
        '401':
          $ref: '../components/responses.yaml#/Unauthorized'
        '404':
          $ref: '../components/responses.yaml#/NotFound'
        '409':
          $ref: '../components/responses.yaml#/Conflict'
        '500':
          $ref: '../components/responses.yaml#/ServerError'

  /api/battle/{sessionId}/start:
    post:
      tags: [Battle]
      summary: 배틀룸 카운트다운 시작(방장)
      description: 방장이 카운트다운을 시작합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                countdownSec:
                  type: integer
                  minimum: 0
                  maximum: 30
                  default: 3
      responses:
        '200':
          description: Countdown started
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/BattleCountdownStartResponse'
              example:
                started: true
                state: waiting
                countdown:
                  seconds: 3
                round:
                  current: 1
                  total: 5
                questions:
                  - questionId: '61'
                    text: Example correct sentence 1
                    explanation: Example explanation 1
                  - questionId: '15'
                    text: Example correct sentence 2
                    explanation: Example explanation 2
                  - questionId: '72'
                    text: Example correct sentence 3
                    explanation: Example explanation 3
                  - questionId: '39'
                    text: Example correct sentence 4
                    explanation: Example explanation 4
                  - questionId: '30'
                    text: Example correct sentence 5
                    explanation: Example explanation 5
        '400':
          $ref: '../components/responses.yaml#/BadRequest'
        '401':
          $ref: '../components/responses.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses.yaml#/Forbidden'
        '404':
          $ref: '../components/responses.yaml#/NotFound'
        '409':
          $ref: '../components/responses.yaml#/Conflict'
        '422':
          $ref: '../components/responses.yaml#/NotEnoughQuestions'
        '500':
          $ref: '../components/responses.yaml#/ServerError'

  /api/battle/entry:
    post:
      tags: [Battle]
      summary: 배틀룸 입장(상대 플레이어)
      description:  초대 코드(roomCode)로 대기 중인 배틀룸에 입장합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomCode]
              properties:
                roomCode:
                  type: string
                  example: C2R699
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/BattleEntryResponse'
              example:
                sessionId: b_w1kGLU_M
                roomCode: METZXD
                state: waiting
                players:
                  - playerId: plr_host123
                    isHost: true
                  - playerId: plr_guest456
                    isHost: false
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: 404_ROOM_NOT_FOUND }
                  message: { type: string, example: Room not found }
        '409':
          description: Room full
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: 409_ROOM_FULL }
                  message: { type: string, example: Room already has 2 players }
        '423':
          description: Room locked
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: 423_ROOM_LOCKED }
                  message: { type: string, example: Room is not in waiting state }
        '401':
          $ref: '../components/responses.yaml#/Unauthorized'
        '500':
          $ref: '../components/responses.yaml#/ServerError'

  /api/battle/{sessionId}/result:
    get:
      tags: [Battle]
      summary: Get battle result
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, example: b_9p1v4t }
      responses:
        '200':
          description: Battle result fetched
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/BattleResultResponse'
              example:
                state: ended
                result: lose
                summary:
                  - playerId: plr_guest456
                    isHost: false
                    score: 2
                    wrong: 3
                rounds:
                  - round: 1
                    question:
                      questionId: '61'
                      text: Example correct sentence 1
                      explanation: Example explanation 1
                    players:
                      - playerId: plr_guest456
                        isHost: false
                        isCorrect: false
                        lastAnswer: Example wrong answer 1
                        answerText: Example wrong answer 1
                        submittedText: Example wrong answer 1
                    winner: plr_host123
                  - round: 2
                    question:
                      questionId: '15'
                      text: Example correct sentence 2
                      explanation: Example explanation 2
                    players:
                      - playerId: plr_guest456
                        isHost: false
                        isCorrect: true
                        lastAnswer: Example correct sentence 2
                        answerText: Example correct sentence 2
                        submittedText: Example correct sentence 2
                    winner: plr_guest456
        '401':
          $ref: '../components/responses.yaml#/Unauthorized'
        '404':
          $ref: '../components/responses.yaml#/NotFound'
        '500':
          $ref: '../components/responses.yaml#/ServerError'

  /api/battle/{sessionId}:
    get:
      tags: [Battle]
      summary: 배틀룸 조회
      description: 세션의 현재 상태와 라운드/문제/점수 요약을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, example: b_9p1v4t }
      responses:
        '200':
          description: Battle room fetched
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/BattleRoomResponse'
              example:
                state: playing
                hostId: plr_host123
                round:
                  current: 2
                  total: 5
                question:
                  questionId: '15'
                  text: Example correct sentence 2
                  explanation: Example explanation 2
                summary:
                  - playerId: plr_host123
                    isHost: true
                    score: 1
                    wrong: 0
                    isCorrectByRound: [true, null, null, null, null]
                  - playerId: plr_guest456
                    isHost: false
                    score: 0
                    wrong: 1
                    isCorrectByRound: [false, null, null, null, null]
                remainingTime: 27
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: 404_ROOM_NOT_FOUND }
                  message: { type: string, example: Room not found }
        '401':
          $ref: '../components/responses.yaml#/Unauthorized'
        '500':
          $ref: '../components/responses.yaml#/ServerError'

  /api/battle/{sessionId}/delete:
    delete:
      tags: [Battle]
      summary: 배틀룸 세션 삭제
      description: 사용자가 홈으로 돌아갈 때, 자신의 배틀 세션을 즉시 삭제합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          description: Battle session ID
          schema:
            type: string
            example: b_ab12cd34
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/BattleDeleteResponse'
              example:
                deleted: true
                sessionId: b_w1kGLU_M
                message: Battle session deleted
        '401':
          $ref: '../components/responses.yaml#/Unauthorized'
        '404':
          $ref: '../components/responses.yaml#/NotFound'
        '409':
          $ref: '../components/responses.yaml#/Conflict'
        '500':
          $ref: '../components/responses.yaml#/ServerError'
