paths:
  /api/practice/start:
    post:
      tags: [Practice]
      summary: 연습모드 시작하기(방 생성)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                countdownSec:
                  type: integer
                  minimum: 0
                  maximum: 30
                  default: 3
      responses:
        "200":
          description: Practice session started
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/PracticeStartResponse'
        "400": { $ref: '../components/responses.yaml#/BadRequest' }
        "401": { $ref: '../components/responses.yaml#/Unauthorized' }
        "404": { $ref: '../components/responses.yaml#/NotFound' }
        "409": { $ref: '../components/responses.yaml#/Conflict' }
        "500": { $ref: '../components/responses.yaml#/ServerError' }

  /api/practice/{sessionId}/answer:
    post:
      tags: [Practice]
      summary: 연습모드 정답 제출
      description: 현재 라운드의 정답을 제출합니다. 마지막 라운드면 세션이 `ENDED`로 전환됩니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PracticeAnswerRequest'
      responses:
        "200":
          description: 다음 문제 또는 종료 안내
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../components/schemas.yaml#/PracticeAnswerNext'
                  - $ref: '../components/schemas.yaml#/PracticeAnswerEnd'
        "400": { $ref: '../components/responses.yaml#/BadRequest' }
        "401": { $ref: '../components/responses.yaml#/Unauthorized' }
        "404": { $ref: '../components/responses.yaml#/NotFound' }
        "409": { $ref: '../components/responses.yaml#/Conflict' }
        "500": { $ref: '../components/responses.yaml#/ServerError' }

  /api/practice/{sessionId}/result:
    get:
      tags: [Practice]
      summary: 연습모드 결과 조회 (ENDED 상태에서만)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 결과 표
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/PracticeResultResponse'
        "400": { $ref: '../components/responses.yaml#/BadRequest' }
        "401": { $ref: '../components/responses.yaml#/Unauthorized' }
        "404": { $ref: '../components/responses.yaml#/NotFound' }
        "409": { $ref: '../components/responses.yaml#/Conflict' }
        "500": { $ref: '../components/responses.yaml#/ServerError' }

  /api/practice/{sessionId}:
    get:
      tags: [Practice]
      summary: 연습모드 조회
      description: 카운트다운/플레이/종료 상태에 맞는 최소 정보 반환(새로고침 복구용)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 현재 상태 스냅샷
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/PracticeResumeResponse'
        "400": { $ref: '../components/responses.yaml#/BadRequest' }
        "401": { $ref: '../components/responses.yaml#/Unauthorized' }
        "404": { $ref: '../components/responses.yaml#/NotFound' }
        "409": { $ref: '../components/responses.yaml#/Conflict' }
        "500": { $ref: '../components/responses.yaml#/ServerError' }

    delete:
      tags: [Practice]
      summary: 연습모드 세션 삭제
      description: 사용자가 홈으로 돌아갈 때, 자신의 연습 세션을 즉시 삭제합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
               $ref: '../components/schemas.yaml#/PracticeDeleteResponse'
        '400': { $ref: '../components/responses.yaml#/BadRequest' }
        '401': { $ref: '../components/responses.yaml#/Unauthorized' }
        '403': { $ref: '../components/responses.yaml#/Forbidden' }
        '404': { $ref: '../components/responses.yaml#/NotFound' }
        '500': { $ref: '../components/responses.yaml#/ServerError' }
