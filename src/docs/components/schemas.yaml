GuestResponse:
  type: object
  properties:
    playerId: { type: string, example: plr_w2a1bC7X9pQe }
    guestToken: { type: string, description: JWT Bearer token }
    expiresAt: { type: string, format: date-time, example: 2025-10-22T12:34:56.000Z }

# 공통 객체
PracticeRound:
  type: object
  properties:
    current: { type: integer, minimum: 1, example: 1 }
    total: { type: integer, minimum: 1, example: 5 }
  required: [current, total]

PracticeCountdown:
  type: object
  properties:
    seconds: { type: integer, minimum: 0, maximum: 30, example: 3 }
  required: [seconds]

PracticeQuestionPublic:
  type: object
  properties:
    questionId: { type: string, example: '8' }
    text: { type: string, example: '집에 (   ) 버스 타고 가?' }
    options:
      type: array
      minItems: 2
      maxItems: 2
      items: { type: string }
  required: [questionId, text, options]

# 요청 스키마
PracticeAnswerRequest:
  type: object
  properties:
    round:
      oneOf:
        - type: integer
          minimum: 1
          example: 3
        - type: object
          properties:
            current: { type: integer, minimum: 1, example: 3 }
          required: [current]
    answer:
      type: string
      enum: [choice1, choice2]
      nullable: true
      description: 정답 선택. 시간 초과(auto submit)일 때는 null 또는 필드 생략 가능.
  required: [round]

# 응답 스키마
PracticeStartResponse:
  type: object
  properties:
    sessionId: { type: string, example: p_ab12cd34 }
    status: { type: string, enum: [playing, ended], example: playing }
    countdown: { $ref: '#/PracticeCountdown' }
    round: { $ref: '#/PracticeRound' }
    timeLimit: { type: integer, example: 20 }
    questions:
      type: array
      minItems: 5
      maxItems: 5
      items: { $ref: '#/PracticeQuestionPublic' }
  required: [sessionId, status, countdown, round, timeLimit, questions]

PracticeAnswerNext:
  type: object
  properties:
    round: { $ref: '#/PracticeRound' }
    next:
      type: object
      properties:
        hasNext: { type: boolean, example: true }
        result: { type: string, enum: [correct, wrong, timeout], example: correct }
        question: { $ref: '#/PracticeQuestionPublic' }
      required: [hasNext, result, question]
    isCorrectByRound:
      type: array
      minItems: 1
      items:
        type: boolean
        nullable: true
      example: [false, false, null, null, null]
  required: [round, next]

PracticeAnswerEnd:
  type: object
  properties:
    status: { type: string, enum: [ended], example: ended }
    round: { $ref: '#/PracticeRound' }
    result: { type: string, enum: [correct, wrong, timeout], example: wrong }
    next:
      type: object
      properties:
        hasNext: { type: boolean, example: false }
      required: [hasNext]
  required: [status, round, result, next]

PracticeResultRow:
  type: object
  properties:
    round: { type: integer, example: 3 }
    question: { type: string, example: '그는 (   ) 운동을 했다.' }
    answer: { type: string, example: '열심히' }
    result: { type: string, enum: [correct, wrong, timeout], example: correct }
    correctAnswer: { type: string, example: '한 번', nullable: true }
    explanation: { type: string, example: "수량/횟수일 때는 '한 번'을 씁니다.", nullable: true }
  required: [round, question, result]

PracticeResultResponse:
  type: object
  properties:
    status: { type: string, enum: [ended], example: ended }
    score: { type: integer, example: 4 }
    wrongCount: { type: integer, example: 1 }
    totalRounds: { type: integer, example: 5 }
    questions:
      type: array
      items: { $ref: '#/PracticeResultRow' }
  required: [status, score, wrongCount, totalRounds, questions]

PracticeResumePlaying:
  type: object
  properties:
    sessionId: { type: string, example: p_ab12cd34 }
    status: { type: string, enum: [playing], example: playing }
    countdown:
      type: object
      properties:
        seconds: { type: integer, example: 2 }
      required: [seconds]
      nullable: true
    round: { $ref: '#/PracticeRound' }
    timeLimit: { type: integer, nullable: true, example: 20 }
    remainingTime: { type: integer, nullable: true, example: 18 }
    answeredCount: { type: integer, example: 2 }
    question:
      allOf:
        - $ref: '#/PracticeQuestionPublic'
      nullable: true
    score: { type: integer, example: 2 }
    wrongCount: { type: integer, example: 1 }
    isCorrectByRound:
      type: array
      minItems: 1
      items:
        type: boolean
        nullable: true
      example: [true, true, false, null, null]
  required: [sessionId, status, round, answeredCount, wrongCount]

PracticeResumeEnded:
  type: object
  properties:
    sessionId: { type: string, example: p_ab12cd34 }
    status: { type: string, enum: [ended], example: ended }
    round: { $ref: '#/PracticeRound' }
    score: { type: integer, example: 4 }
    wrongCount: { type: integer, example: 1 }
    totalRounds: { type: integer, example: 5 }
    isCorrectByRound:
      type: array
      minItems: 1
      items:
        type: boolean
        nullable: true
      example: [true, false, true, false, true]
  required: [sessionId, status, round, score, wrongCount, totalRounds]

PracticeResumeResponse:
  oneOf:
    - $ref: '#/PracticeResumePlaying'
    - $ref: '#/PracticeResumeEnded'

PracticeDeleteResponse:
  type: object
  properties:
    deleted: { type: boolean, example: true }
    sessionId: { type: string, example: p_ab12cd34 }
    message: { type: string, example: Practice session deleted }
  required: [deleted, sessionId, message]

# 강제 종료
ForceEndResponse:
  type: object
  properties:
    status: { type: string, enum: [ended], example: ended }
    alreadyEnded: { type: boolean, example: false }
  required: [sessionId, kind, status, alreadyEnded, endedAt]

# Battle 공통 응답 스키마
BattleRound:
  type: object
  properties:
    current: { type: integer, minimum: 1, example: 3 }
    total: { type: integer, minimum: 1, example: 5 }
  required: [current, total]

BattleCountdown:
  type: object
  properties:
    seconds: { type: integer, minimum: 0, maximum: 30, example: 3 }
  required: [seconds]

BattleQuestion:
  type: object
  properties:
    questionId: { type: string, example: '4' }
    text: { type: string, example: '오늘은 날씨가 참 좋다.' }
    wrongText:
      type: string
      nullable: true
      example: '오늘은날씨가 참 좋다.'
    answer:
      type: string
      nullable: true
      example: '오늘은 날씨가 참 좋다.'
    explanation:
      type: string
      nullable: true
      example: '‘오늘은 날씨가’는 띄어 써야 올바른 문장입니다.'
  required: [questionId, text]

BattlePlayerSummary:
  type: object
  properties:
    playerId: { type: string, example: plr_uKIr83x4QBiW }
    isHost: { type: boolean, example: true }
    score: { type: integer, example: 2 }
    wrong: { type: integer, example: 1 }
    isCorrectByRound:
      type: array
      minItems: 1
      items:
        type: boolean
        nullable: true
      example: [true, true, false, null, null]
  required: [playerId, isHost, score, wrong]

BattleEntryPlayer:
  type: object
  properties:
    playerId: { type: string, example: plr_Vy4_SS-FWM7y }
    isHost: { type: boolean, example: true }
  required: [playerId, isHost]

BattleRoundPlayerResult:
  type: object
  properties:
    playerId: { type: string, example: plr_uKIr83x4QBiW }
    isCorrect: { type: boolean, example: false }
    lastAnswer:
      type: string
      nullable: true
      example: '설거지'
  required: [playerId, isCorrect]

BattleRoundResult:
  type: object
  properties:
    round: { type: integer, example: 1 }
    question:
      $ref: '#/BattleQuestion'
    players:
      type: array
      items:
        $ref: '#/BattleRoundPlayerResult'
  required: [round, question, players]

# Battle 응답 객체
BattleRoomCreateResponse:
  type: object
  properties:
    sessionId:
      type: string
      example: b_w1kGLU_M
    roomCode:
      type: string
      example: XH6NZR
    status:
      type: string
      enum: [waiting, playing, ended]
      example: waiting
    hostId:
      type: string
      example: plr_FZYmatbEMod5
    inviteLink:
      type: string
      format: uri
      example: https://hyunseoko.store/join/XH6NZR
  required: [sessionId, roomCode, status, hostId, inviteLink]

BattleCountdownStartResponse:
  type: object
  properties:
    started:
      type: boolean
      example: true
    status:
      type: string
      enum: [waiting, playing, ended]
      example: waiting
    countdown:
      $ref: '#/BattleCountdown'
    round:
      $ref: '#/BattleRound'
    questions:
      type: array
      minItems: 5
      maxItems: 5
      items:
        $ref: '#/BattleQuestion'
  required: [started, status, countdown, round, questions]

BattleEntryResponse:
  type: object
  properties:
    sessionId:
      type: string
      example: b_c9XBcpmP
    roomCode:
      type: string
      example: C2R699
    status:
      type: string
      enum: [waiting, playing, ended]
      example: waiting
    players:
      type: array
      minItems: 1
      maxItems: 2
      items:
        $ref: '#/BattleEntryPlayer'
  required: [sessionId, roomCode, status, players]

BattleAnswerResponse:
  type: object
  properties:
    round:
      $ref: '#/BattleRound'
    next:
      type: object
      properties:
        hasNext: { type: boolean, example: true }
      required: [hasNext]
    sessionId:
      type: string
      example: b_c9XBcpmP
    roomCode:
      type: string
      example: C2R699
    status:
      type: string
      enum: [playing, ended]
      example: playing
    result:
      type: string
      enum: [correct, wrong, timeout]
      example: correct
    winner:
      type: string
      nullable: true
      description: 승자의 playerId. 승자 없음이면 null.
      example: plr_Vy4_SS-FWM7y
    correctAnswer:
      type: string
      nullable: true
      description: 정답. 오답/타임아웃일 때는 비노출(null) 가능.
      example: '할머니께 문안 인사를 드렸다.'
  required:
    - round
    - next
    - sessionId
    - roomCode
    - status
    - result

BattleResultSummaryPlayer:
  type: object
  properties:
    playerId: { type: string, example: plr_uKIr83x4QBiW }
    isHost: { type: boolean, example: true }
    score: { type: integer, example: 3 }
    wrong: { type: integer, example: 2 }
  required: [playerId, isHost, score, wrong]

BattleResultResponse:
  type: object
  properties:
    status:
      type: string
      enum: [ended]
      example: ended
    result:
      type: string
      enum: [win, lose, tie]
      nullable: true
      example: tie
      description: 게임 결과 (승=win, 패=lose, 무승부=tie)
    summary:
      type: array
      items:
        $ref: '#/BattleResultSummaryPlayer'
    rounds:
      type: array
      items:
        $ref: '#/BattleRoundResult'
  required: [status, summary, rounds]

BattleRoomResponse:
  type: object
  properties:
    status:
      type: string
      enum: [waiting, playing, ended]
      example: playing
    hostId:
      type: string
      example: plr_uKIr83x4QBiW
    round:
      $ref: '#/BattleRound'
    question:
      allOf:
        - $ref: '#/BattleQuestion'
      nullable: true
    summary:
      type: array
      items:
        $ref: '#/BattlePlayerSummary'
    remainingTime:
      type: integer
      description: 남은 시간(초). 없으면 0.
      example: 20
  required: [status, hostId, round, summary, remainingTime]

BattleDeleteResponse:
  type: object
  properties:
    deleted:
      type: boolean
      example: true
    sessionId:
      type: string
      example: b_ab12cd34
    message:
      type: string
      example: Battle session deleted
  required: [deleted, sessionId, message]
