<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>배틀모드 WebSocket 테스트(단일 입력/오답표시)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      :root {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          'Apple SD Gothic Neo',
          'Noto Sans KR',
          sans-serif;
      }
      body {
        margin: 0;
        background: #0b0c10;
        color: #eaeaea;
      }
      .wrap {
        max-width: 980px;
        margin: 24px auto;
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      fieldset {
        border: 1px solid #2b2f36;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 16px;
      }
      legend {
        color: #aaa;
        padding: 0 6px;
      }
      .row {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 10px;
        align-items: center;
        margin-bottom: 8px;
      }
      label {
        color: #b9c2cf;
        font-size: 13px;
      }
      input,
      textarea,
      select {
        background: #121419;
        color: #eaeaea;
        border: 1px solid #2b2f36;
        border-radius: 8px;
        padding: 8px;
        width: 100%;
      }
      .btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        background: #1f6feb;
        border: 0;
        color: #fff;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      button.secondary {
        background: #444c56;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr 1fr;
      }
      .card {
        border: 1px solid #2b2f36;
        border-radius: 10px;
        padding: 12px;
        background: #0f1116;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      }
      .log {
        height: 240px;
        overflow: auto;
        background: #0a0b0f;
        border-radius: 8px;
        padding: 10px;
        border: 1px solid #20232a;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        background: #1f6feb;
      }
      .kv {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 8px;
      }
      .muted {
        color: #9aa4b2;
        font-size: 12px;
      }
      .ok {
        color: #7ee787;
      }
      .warn {
        color: #ffd166;
      }
      .err {
        color: #ff6b6b;
      }
      /* 오답 리스트 */
      .attempts {
        margin-top: 8px;
        border-top: 1px solid #222;
        max-height: 220px;
        overflow: auto;
      }
      .attempt {
        display: flex;
        gap: 10px;
        padding: 8px 4px;
        border-bottom: 1px solid #15171d;
        align-items: center;
      }
      .attempt .text {
        flex: 1;
        word-break: break-all;
      }
      .mark {
        min-width: 16px;
        text-align: center;
      }
      .mark.pending {
        opacity: 0.5;
      }
      .mark.bad {
        color: #ff6b6b;
        font-weight: 700;
      }
      .mark.good {
        color: #12b886;
        font-weight: 700;
      }
      .flash {
        margin: 8px 0;
        padding: 10px;
        border-radius: 8px;
        background: #0f1b12;
        border: 1px solid #1b3d23;
        color: #8ce99a;
      }
      .row.inline > * {
        align-self: start;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>⚔️ 배틀모드 WebSocket 테스트 (단일 입력/자동 전환)</h1>

      <fieldset>
        <legend>연결 설정</legend>
        <div class="row">
          <label>API BASE(URL)</label>
          <!-- 기본값: 배포 서버로 바로 테스트 가능 -->
          <input id="baseUrl" placeholder="예) https://hyunseoko.store" />
        </div>
        <div class="row"><label>Socket Path</label><input id="socketPath" value="/ws" /></div>
        <div class="row">
          <label>playerId</label><input id="playerId" placeholder="예) plr_host 또는 임의" />
        </div>
        <div class="row">
          <label>guestToken (선택)</label>
          <input id="guestToken" placeholder="현재 WS 미사용 / 필요 시 확장용" />
        </div>
        <div class="btns">
          <button id="btnConnect">연결</button>
          <button id="btnDisconnect" class="secondary">연결 해제</button>
        </div>
        <div class="muted">
          1) <b>sessionId 입력</b> → 2) <b>연결</b> → 3) <b>Join</b> → 입력칸에서 타이핑/엔터로 정답
          제출 흐름 테스트.
        </div>
      </fieldset>

      <div class="grid">
        <div class="card">
          <h3>1) 방 참가 / 라운드</h3>
          <div class="row">
            <label>sessionId</label
            ><input id="sessionId" placeholder="예) b_9p1v4t (실제 세션 ID 입력)" />
          </div>
          <div class="row">
            <label>round(current)</label><input id="round" type="number" value="1" />
          </div>
          <div class="btns">
            <button id="btnJoin">Join (battle:join)</button>
            <button id="btnLeave" class="secondary">Leave Room</button>
          </div>
          <div class="kv" style="margin-top: 12px">
            <div>상태</div>
            <div><span id="status" class="badge">DISCONNECTED</span></div>
            <div>남은 시간</div>
            <div><span id="remainSec">-</span> 초</div>
            <div>서버 라운드</div>
            <div><span id="serverRound">-</span></div>
          </div>

          <!-- 정답 맞춤 플래시 -->
          <div id="flash" class="flash" style="display: none"></div>

          <!-- 내 시도 리스트 -->
          <h4 style="margin: 14px 0 6px">🧑‍💻 내 제출 기록</h4>
          <div id="attempts" class="attempts"></div>

          <!-- 단일 입력칸 -->
          <div class="row inline" style="margin-top: 10px">
            <label>입력(타이핑=전송 / Enter=제출)</label>
            <input id="singleInput" placeholder="여기에 입력하고 Enter로 제출" />
          </div>
          <div class="btns" style="margin-top: 6px">
            <button id="btnSendTyping" class="secondary">타이핑 즉시 전송</button>
            <button id="btnSubmit">제출 (battle:answer:submit)</button>
            <button id="btnClearInput" class="secondary">입력 지우기</button>
          </div>
        </div>

        <div class="card">
          <h3>상대 실시간 프리뷰 & 로그</h3>
          <div style="margin-bottom: 10px">
            <div class="muted">상대 프리뷰</div>
            <div id="opponentPreview" class="mono">-</div>
          </div>
          <div id="log" class="log mono"></div>
          <div class="btns" style="margin-top: 8px">
            <button id="btnClearLog" class="secondary">로그 지우기</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ========== Helpers ==========
      const $ = (s) => document.querySelector(s);
      const logBox = $('#log');
      const statusBadge = $('#status');
      const remainSecEl = $('#remainSec');
      const serverRoundEl = $('#serverRound');
      const opponentPreview = $('#opponentPreview');
      const attemptsEl = $('#attempts');
      const flashEl = $('#flash');

      function appendLog(msg, type = '') {
        const time = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        line.innerHTML = `[${time}] ${msg}`;
        if (type === 'ok') line.classList.add('ok');
        if (type === 'warn') line.classList.add('warn');
        if (type === 'err') line.classList.add('err');
        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;
      }
      function setStatus(text, color = '#1f6feb') {
        statusBadge.textContent = text;
        statusBadge.style.background = color;
      }
      function debounce(fn, delay) {
        let t = null;
        return (...a) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...a), delay);
        };
      }

      // ========== State for attempts (내 기록) ==========
      const myAttempts = []; // {id, text, result:'pending'|'wrong'|'correct'}
      function renderAttempts() {
        attemptsEl.innerHTML = '';
        myAttempts.forEach((a) => {
          const row = document.createElement('div');
          row.className = 'attempt';
          const text = document.createElement('div');
          text.className = 'text';
          text.textContent = a.text;
          const mark = document.createElement('div');
          mark.className =
            'mark ' + (a.result === 'pending' ? 'pending' : a.result === 'wrong' ? 'bad' : 'good');
          mark.textContent = a.result === 'pending' ? '·' : a.result === 'wrong' ? 'X' : 'O';
          row.appendChild(text);
          row.appendChild(mark);
          attemptsEl.prepend(row);
        });
      }
      function pushAttempt(text) {
        const id = crypto.randomUUID();
        myAttempts.push({ id, text, result: 'pending' });
        renderAttempts();
        return id;
      }
      function markLastPending(result) {
        // 'wrong' | 'correct'
        const idx = [...myAttempts].reverse().findIndex((a) => a.result === 'pending');
        if (idx === -1) return;
        const real = myAttempts.length - 1 - idx;
        myAttempts[real].result = result;
        renderAttempts();
      }
      function resetRoundUI() {
        myAttempts.splice(0, myAttempts.length);
        renderAttempts();
        $('#singleInput').value = '';
        $('#singleInput').disabled = false;
        flash('');
      }
      function flash(text) {
        if (!text) {
          flashEl.style.display = 'none';
          flashEl.textContent = '';
          return;
        }
        flashEl.textContent = `✅ 정답: ${text}`;
        flashEl.style.display = 'block';
      }

      // ========== Socket ==========
      let socket = null,
        joinedRoom = null,
        mePlayerId = null;

      function connect() {
        let base = ($('#baseUrl').value || '').trim();
        const path = ($('#socketPath').value || '/ws').trim();
        mePlayerId = ($('#playerId').value || '').trim();
        const token = ($('#guestToken').value || '').trim();

        if (!base) {
          // 기본값: 배포 서버
          base = 'https://hyunseoko.store';
          $('#baseUrl').value = base;
        }

        appendLog(`연결 시도 → ${base} (path=${path})`);
        socket = io(base, {
          path,
          transports: ['websocket'],
          // 현재 서버는 playerId만 사용 중
          auth: { playerId: mePlayerId || `plr_${Math.random().toString(36).slice(2, 8)}`, token },
        });

        socket.on('connect', () => {
          appendLog(`✅ connected: ${socket.id}`, 'ok');
          setStatus('CONNECTED');
        });
        socket.on('connect_error', (e) => {
          appendLog(`❌ connect_error: ${e.message}`, 'err');
          setStatus('ERROR', '#e63946');
        });
        socket.on('disconnect', (r) => {
          appendLog(`🔌 disconnected: ${r}`);
          setStatus('DISCONNECTED', '#444c56');
        });

        // 실시간 타이핑(상대 미리보기)
        socket.on('battle:typing:update', (p) => {
          appendLog(
            `✍️ typing:update from=${p.playerId} round=${p.round} preview="${p.preview}" len=${p.len}`,
          );
          opponentPreview.textContent = p.preview || '-';
        });

        // 채점 결과
        socket.on('battle:answer:result', (p) => {
          appendLog(
            `🟢 answer:result from=${p.playerId} round=${p.round} result=${p.result} correct="${p.correctAnswer || ''}"`,
          );
          if (p.playerId === mePlayerId) {
            markLastPending(p.result === 'correct' ? 'correct' : 'wrong');
            if (p.result === 'correct') {
              flash(p.correctAnswer || '');
              $('#singleInput').disabled = true;
              setTimeout(() => {
                flash('');
              }, 1200);
            }
          }
        });

        // 라운드 틱(남은 시간/서버 라운드)
        socket.on('battle:round:ticker', (p) => {
          remainSecEl.textContent = p?.remainingSec ?? '-';
          if (p?.round?.current)
            serverRoundEl.textContent = `${p.round.current}/${p.round.total || '?'}`;
        });

        // 라운드 전환 방송 → 다음 라운드로 초기화
        socket.on('battle:round:next', (p) => {
          const cur = p?.round?.current,
            tot = p?.round?.total,
            rem = p?.remainingSec;
          appendLog(`⏭️ round:next → ${cur}/${tot} (${rem ?? '-'}s)`, 'ok');
          if (cur) {
            $('#round').value = cur;
            serverRoundEl.textContent = `${cur}/${tot}`;
          }
          if (typeof rem === 'number') remainSecEl.textContent = rem;
          resetRoundUI();
        });

        socket.on('battle:round:end', () => {
          appendLog('🏁 game ended', 'ok');
          remainSecEl.textContent = '0';
          setStatus('ENDED', '#6c5ce7');
        });

        socket.on('battle:player_joined', (p) => {
          const names = (p?.players || [])
            .map((x) => `${x.playerId}${x.isHost ? '(host)' : ''}`)
            .join(', ');
          appendLog(`👥 player_joined: ${names}`);
        });
      }

      function disconnect() {
        if (!socket) return;
        socket.disconnect();
        socket = null;
        joinedRoom = null;
        setStatus('DISCONNECTED', '#444c56');
        appendLog('연결 해제 완료');
      }

      function joinRoom() {
        if (!socket || !socket.connected) return appendLog('먼저 연결하세요.', 'warn');
        const sessionId = ($('#sessionId').value || '').trim();
        if (!sessionId) return appendLog('sessionId가 필요합니다.', 'warn');

        socket.emit('battle:join', { sessionId }, (res) => {
          if (res?.ok) {
            joinedRoom = sessionId;
            appendLog(`🚪 Joined room: ${sessionId} (you=${res.you?.playerId})`, 'ok');
          } else appendLog(`join 실패: ${res?.message || 'unknown'}`, 'err');
        });
      }
      function leaveRoom() {
        if (!socket || !joinedRoom) return;
        appendLog(`🚶 (클라 상태) 방 나가기: ${joinedRoom}`);
        joinedRoom = null;
      }

      // ========== 단일 입력칸: 타이핑 + 제출 ==========
      let composing = false;
      const sendTypingDebounced = debounce(sendTyping, 150);

      const inputEl = $('#singleInput');
      inputEl.addEventListener('compositionstart', () => (composing = true));
      inputEl.addEventListener('compositionend', () => {
        composing = false;
        sendTyping(true);
      });
      inputEl.addEventListener('input', () => {
        if (!composing) sendTypingDebounced();
      });
      inputEl.addEventListener('compositionupdate', () => sendTyping(true));

      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitAnswer();
        }
      });

      function sendTyping(immediate = false) {
        if (!socket || !socket.connected) return appendLog('먼저 연결하세요.', 'warn');
        if (!joinedRoom) return appendLog('먼저 Join 하세요.', 'warn');
        const sessionId = joinedRoom;
        const round = Number($('#round').value || 1);
        const text = inputEl.value;
        const payload = { sessionId, round, text };
        socket.emit('battle:typing', payload);
        if (immediate) appendLog(`→ battle:typing ${JSON.stringify(payload)}`);
      }

      function submitAnswer() {
        if (!socket || !socket.connected) return appendLog('먼저 연결하세요.', 'warn');
        if (!joinedRoom) return appendLog('먼저 Join 하세요.', 'warn');

        const answerText = (inputEl.value || '').trim();
        if (!answerText) return appendLog('입력이 비어있습니다.', 'warn');

        pushAttempt(answerText);

        const sessionId = joinedRoom;
        const round = Number($('#round').value || 1);
        const payload = { sessionId, round, answerText };
        socket.emit('battle:answer:submit', payload, (res) => {
          if (res?.ok) {
            appendLog(`→ answer:submit OK (result=${res.result})`, 'ok');
          } else {
            appendLog(`→ answer:submit FAIL: ${res?.message || 'unknown'}`, 'err');
            markLastPending('wrong');
          }
        });

        inputEl.value = '';
      }

      // ========== 버튼 바인딩 ==========
      $('#btnConnect').addEventListener('click', connect);
      $('#btnDisconnect').addEventListener('click', disconnect);
      $('#btnJoin').addEventListener('click', joinRoom);
      $('#btnLeave').addEventListener('click', leaveRoom);
      $('#btnSendTyping').addEventListener('click', () => sendTyping(true));
      $('#btnSubmit').addEventListener('click', submitAnswer);
      $('#btnClearInput').addEventListener('click', () => (inputEl.value = ''));
      $('#btnClearLog').addEventListener('click', () => (logBox.innerHTML = ''));

      // 기본값 세팅
      window.addEventListener('DOMContentLoaded', () => {
        // 배포 서버 기본값
        $('#baseUrl').value = 'https://hyunseoko.store';
        if (!$('#playerId').value)
          $('#playerId').value = 'plr_test_' + Math.random().toString(36).slice(2, 7);
      });
    </script>
  </body>
</html>
